  <rect x="0" y="300" width="600" height="60" fill="rgba(0,0,0,0.5)"/>
  <text x="300" y="325" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="white" text-anchor="middle">Payment Gateway Service (EDC)</text>
  <text x="300" y="348" font-family="Arial,sans-serif" font-size="12" fill="rgba(80,220,140,0.9)" text-anchor="middle">Angular  ·  Java Spring Boot  ·  PostgreSQL</text>
