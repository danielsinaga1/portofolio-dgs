  <rect x="190" y="110" width="50" height="38" rx="6" fill="rgba(255,220,80,0.8)" stroke="rgba(200,170,0,0.5)" stroke-width="1"/>
  <line x1="215" y1="110" x2="215" y2="148" stroke="rgba(200,160,0,0.5)" stroke-width="1"/>
  <line x1="190" y1="129" x2="240" y2="129" stroke="rgba(200,160,0,0.5)" stroke-width="1"/>
  <!-- Contactless icon -->
  <path d="M280 118 Q295 129 280 140" stroke="rgba(255,255,255,0.7)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M288 112 Q307 129 288 146" stroke="rgba(255,255,255,0.5)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M296 106 Q319 129 296 152" stroke="rgba(255,255,255,0.3)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Card number -->
  <rect x="190" y="162" width="30" height="10" rx="3" fill="rgba(255,255,255,0.5)"/>
  <rect x="228" y="162" width="30" height="10" rx="3" fill="rgba(255,255,255,0.5)"/>
  <rect x="266" y="162" width="30" height="10" rx="3" fill="rgba(255,255,255,0.5)"/>
  <rect x="304" y="162" width="30" height="10" rx="3" fill="rgba(255,255,255,0.7)"/>
  <!-- Cardholder name -->
  <rect x="190" y="188" width="100" height="8" rx="3" fill="rgba(255,255,255,0.5)"/>
  <!-- Bank brand circles -->
  <circle cx="382" cy="185" r="18" fill="rgba(255,50,50,0.6)"/>
  <circle cx="404" cy="185" r="18" fill="rgba(255,150,0,0.6)"/>
  <!-- Sidebar stats -->
  <rect x="30" y="68" width="110" height="50" rx="10" fill="rgba(255,255,255,0.07)"/>
  <rect x="38" y="78" width="60" height="8" rx="3" fill="rgba(0,220,100,0.7)"/>
  <rect x="38" y="94" width="90" height="12" rx="3" fill="rgba(255,255,255,0.4)"/>
  <rect x="30" y="130" width="110" height="50" rx="10" fill="rgba(255,255,255,0.07)"/>
  <rect x="38" y="140" width="70" height="8" rx="3" fill="rgba(0,220,100,0.5)"/>
  <rect x="38" y="156" width="85" height="12" rx="3" fill="rgba(255,255,255,0.3)"/>
